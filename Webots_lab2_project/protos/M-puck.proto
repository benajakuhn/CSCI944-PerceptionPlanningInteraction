      appearance USE EPUCK_TRANSPARENT_APPEARANCE
      enableBoundingObject FALSE
    }
    DEF EPUCK_RECEIVER Receiver {
      channel IS receiver_channel
    }
    DEF EPUCK_EMITTER Emitter {
      channel IS emitter_channel
    }
    DEF EPUCK_SPEAKER Speaker {
    }
    DEF TURRET_SLOT Pose {
      translation -0.02375 0 0.1215
      children IS turretSlot
    }
    DEF GROUND_SENSOR_SLOT Pose {
      translation 0.075 0 0.00075
      children IS groundSensorsSlot
    }
  ]
  name IS name
  %< if (v2) { >%
    model "GCtronic e-puck2"
  %< } else { >%
    model "GCtronic e-puck"
  %< } >%
  description "Educational robot designed at EPFL"
  boundingObject Group {
    children [
      Pose {
        translation 0 0 0.0625
        rotation 1 0 0 3.141589
        children [
          Cylinder {
            height 0.1125
            radius 0.0925
            subdivision 24
          }
        ]
      }
      Pose {
        translation 0 0 0.0175
        children [
          Box {
            size 0.125 0.1 0.025
          }
        ]
      }
    ]
  }
  %< if (!kinematic) { >%
    physics Physics {
      density -1
      %< if (v2) { >%
        mass 2.03125
      %< } else { >%
        mass 2.34375
      %< } >%
      centerOfMass [0 0 0.0375]
      inertiaMatrix [0.009556494141 0.008440751953 0.008543642578, 0 0 0]
    }
  %< } >%
  controller IS controller
  controllerArgs IS controllerArgs
  window IS window
  customData IS customData
  supervisor IS supervisor
  synchronization IS synchronization
  battery IS battery
  cpuConsumption 1.11 # 100% to 0% in 90[s] (calibrated for the rat's life contest)
  %< if (fields.window.value != "<generic>" && fields.window.value != "<none>") {
       if (v2) { >%
         remoteControl "e-puck_wifi"
  %<   } else { >%
         remoteControl "e-puck_bluetooth"
  %<   }
     } >%
}
}
